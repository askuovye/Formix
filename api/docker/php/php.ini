; Não anunciar a versão do PHP nos cabeçalhos.
expose_php = Off

memory_limit = 256M

; Limites de upload no nível do PHP. O limite efetivo por campo/requisição é
; validado pela aplicação (fase de anexos); estes valores são o teto absoluto.
upload_max_filesize = 25M
post_max_size = 60M
max_file_uploads = 20

opcache.enable_cli = 0
